<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jal Sanrakshan | Water Conservation Portal</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <header class="hero">
        <h1 data-t="trH"></h1>
        <p data-t="trP"></p>
    </header>
    <main class="wrap">
        <div class="tracker">
            <div class="habits" id="hb"></div>
            <div class="tankbox">
                <div class="tank" aria-hidden="true">
                    <div class="fill" id="fill"></div>
                </div>
                <p><b id="d">0</b> <span data-t="tL"></span></p>
                <p><b id="mo">0</b> <span data-t="tM"></span></p>
                <p id="v" aria-live="polite"></p>
            </div>
        </div>
        <div class="calc">
            <h2 data-t="cH"></h2>
            <p data-t="cP"></p>
            <div class="row"><label for="b" data-t="cB"></label><input id="b" type="number" min="0" value="2"></div>
            <div class="row"><label for="w" data-t="cW"></label><input id="w" type="number" min="0" value="1"></div>
            <div class="row"><label for="c" data-t="cC"></label><input id="c" type="number" min="0" value="30"></div>
            <button class="btn" id="go" data-t="cGo"></button>
            <p id="res" style="margin-top:12px;font-weight:700" aria-live="polite"></p>
        </div>
    </main>
    <script src="assets/common.js"></script>
    <script>
        const H = [[["Close the tap while brushing", "ब्रश करते समय नल बंद रखें", "दात घासताना नळ बंद ठेवा"], 6],
        [["Use a bucket instead of a long shower", "लंबे शावर की जगह बाल्टी से नहाएं", "जास्त वेळ शॉवरऐवजी बादलीने आंघोळ करा"], 40],
        [["Fix a dripping tap or pipe", "टपकता नल या पाइप ठीक करें", "गळणारा नळ किंवा पाईप दुरुस्त करा"], 20],
        [["Run washing machine only with a full load", "वॉशिंग मशीन पूरा भरकर ही चलाएं", "वॉशिंग मशीन पूर्ण भरूनच चालवा"], 30],
        [["Reuse RO reject water for mopping or plants", "RO का बेकार पानी पोछे या पौधों में इस्तेमाल करें", "RO चे वाया जाणारे पाणी फरशी पुसायला किंवा झाडांना वापरा"], 10],
        [["Wash vehicle with a bucket, not a pipe", "गाड़ी पाइप की जगह बाल्टी से धोएं", "गाडी पाईपऐवजी बादलीने धुवा"], 100],
        [["Water plants early morning with a can", "पौधों को सुबह जल्दी डिब्बे से पानी दें", "झाडांना सकाळी लवकर झारीने पाणी द्या"], 15]];
        const MAX = H.reduce((a, x) => a + x[1], 0); let on = H.map(() => false), last = null;
        function upd() { const s = H.reduce((a, x, i) => a + (on[i] ? x[1] : 0), 0); d.textContent = s; mo.textContent = s * 30; fill.style.height = Math.round(s / MAX * 100) + "%"; v.textContent = T(!s ? S.tV0 : s < 50 ? S.tV1 : s < 150 ? S.tV2 : S.tV3) }
        function showRes() { res.textContent = last === null ? "" : `${T(S.cE)}: ${last} ${T(S.cU)} (${last * 30} ${T(S.tM)}). ` + T(last > 135 ? S.cHi : S.cLo) }
        function draw() {
            hb.innerHTML = H.map((h, i) => `<label><input type="checkbox" data-k="${i}" ${on[i] ? "checked" : ""}> ${T(h[0])}<span class="l">~${h[1]} L</span></label>`).join("");
            hb.querySelectorAll("input").forEach(c => c.onchange = () => { on[+c.dataset.k] = c.checked; upd() }); upd(); showRes()
        }
        go.onclick = () => { last = b.value * 15 + w.value * 50 + +c.value; showRes() };
        setLang(LI);
    </script>
</body>

</html>
