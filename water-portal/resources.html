<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resources | Jal Sanrakshan</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <header class="hero">
        <h1>Resources</h1>
        <p>Every card opens real information in a new tab.</p>
        <form class="search" id="sf"><input id="q" placeholder="Search any water topic" aria-label="Search"
                required><button class="btn" type="submit">Search on Google</button></form>
    </header>
    <main class="wrap">
        <h2>Topics</h2>
        <div class="grid" id="tp"></div>
        <h2>Official websites</h2>
        <div class="grid" id="gv"></div>
    </main>
    <script src="assets/common.js"></script>
    <script>
        const t = [["Water scarcity", "Why usable freshwater is limited.", "water scarcity causes and solutions", "Water_scarcity"], ["Water conservation", "Ways to use less water.", "water conservation methods", "Water_conservation"], ["Rainwater harvesting", "Collect and store rain.", "rainwater harvesting methods", "Rainwater_harvesting"], ["Drip irrigation", "Efficient farm watering.", "drip irrigation system", "Drip_irrigation"], ["Greywater recycling", "Reuse bathing and washing water.", "greywater recycling system", "Greywater"], ["Watershed management", "Manage the whole catchment.", "watershed management India", "Watershed_management"], ["Groundwater depletion", "Falling water tables.", "groundwater depletion India", "Groundwater_depletion"], ["Wastewater treatment", "Cleaning used water.", "wastewater treatment process", "Sewage_treatment"], ["Water pollution", "Effects on rivers and drinking water.", "water pollution causes effects", "Water_pollution"]];
        tp.innerHTML = t.map(x => `<article class="card"><h3>${x[0]}</h3><p>${x[1]}</p>${linkRow(x[2], x[3])}</article>`).join("");
        const g = [["Ministry of Jal Shakti", "Water resources, river development and Ganga rejuvenation.", "https://jalshakti-dowr.gov.in"], ["Jal Jeevan Mission", "Tap water for rural households.", "https://jaljeevanmission.gov.in"], ["Central Ground Water Board", "Groundwater data and reports in India.", "https://cgwb.gov.in"], ["UN SDG 6", "Global goal for clean water and sanitation.", "https://sdgs.un.org/goals/goal6"]];
        gv.innerHTML = g.map(x => `<article class="card"><h3>${x[0]}</h3><p>${x[1]}</p><div class="links">${ext(x[2], "Open website")}</div></article>`).join("");
        sf.onsubmit = e => { e.preventDefault(); const v = q.value.trim(); if (v) window.open(G(v + " water conservation"), "_blank", "noopener") };
    </script>
</body>

</html>
